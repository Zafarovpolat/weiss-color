<!DOCTYPE html>
<!--
  Экран: М25 — «Заказать звонок» (окно)
  Исходник PSD: 01_исходники/макеты_psd/Заказ обратного звонка.psd
  Пункт ТЗ: п.9.3 — обратный звонок
  Этап 1 (вёрстка): статическая адаптивная разметка HTML/CSS/JS на демо-данных.
  Окно 1691×986: фото-панель с логотипом слева, форма справа.
-->
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- До подгонки по высоте страницу не показываем: браузер иначе рисует её
       в 1:1 и через мгновение «прыгает» (замер: отрисовка на 552 мс,
       масштаб на 708 мс). Показ страхует CSS-анимация через 2 с.
       Ниже 2550 подгонки нет, поэтому правило работает только от 2550px. -->
  <style>@media (min-width:2550px){html{visibility:hidden;animation:weiss-reveal 0s 2s forwards}}@keyframes weiss-reveal{to{visibility:visible}}</style>
  <noscript><style>@media (min-width:2550px){html{visibility:visible!important;animation:none}}</style></noscript>
  <script src="../js/zoom-mode.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заказать звонок — Weiss Color</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="preload" as="font" type="font/woff2" href="../assets/fonts/montserrat-cyrillic-500-normal.woff2" crossorigin>
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/modals.css">
</head>
<body>
  <main class="mcard-demo">
    <section class="mcard mcard-callback" role="dialog" aria-modal="true" aria-labelledby="callback-title">
      <button class="mcard__close" type="button" aria-label="Закрыть окно">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
          <path d="M3 3l18 18M21 3 3 21" stroke-linecap="round"/>
        </svg>
      </button>

      <div class="callback-photo">
        <img class="callback-photo__logo" src="../assets/img/logo-wordmark.svg" width="192" height="54"
             alt="Weiss Color" loading="lazy">
        <hr class="callback-photo__rule">
        <p class="callback-photo__slogan">Вдохновляем<br>на красивые<br>интерьеры</p>
      </div>

      <form class="callback-form" id="callback-modal-form" novalidate>
        <p class="callback-form__eyebrow">Заказать звонок</p>
        <h1 class="callback-form__title" id="callback-title">Мы свяжемся<br>с вами</h1>
        <p class="callback-form__text">
          Оставьте номер телефона и наш специалист перезвонит вам в ближайшее время,<br class="callback-form__break">
          чтобы ответить на все вопросы.
        </p>

        <label class="callback-field">
          <span class="visually-hidden">Ваше имя</span>
          <img class="callback-field__icon" src="../assets/icons/user.svg" width="32" height="33" alt="" aria-hidden="true">
          <input type="text" name="name" autocomplete="name" placeholder="Ваше имя" required>
        </label>

        <label class="callback-field">
          <span class="visually-hidden">Телефон</span>
          <img class="callback-field__icon" src="../assets/icons/phone.svg" width="32" height="31" alt="" aria-hidden="true">
          <input type="tel" name="phone" autocomplete="tel" inputmode="tel"
                 placeholder="+7 ( _ _ _ )_ _ _-_ _-_ _" required>
        </label>

        <button class="btn btn--brown" type="submit">
          Заказать звонок
          <svg class="btn__arrow" viewBox="0 0 52 15" fill="none" aria-hidden="true"><path d="M0 6h44v3H0zM41 0l11 7.5L41 15z" fill="currentColor"/></svg>
        </button>

        <p class="callback-form__note">
          <!-- заливной замок: скоба толстой обводкой + корпус с вырезом-скважиной
               (fill-rule="evenodd" — скважина вырезается из корпуса), как в checkout -->
          <svg viewBox="0 0 20 22" aria-hidden="true" focusable="false">
            <path fill="currentColor" fill-rule="evenodd"
                  d="M2 8.7h16a1.4 1.4 0 0 1 1.4 1.4v9.9a1.4 1.4 0 0 1-1.4 1.4H2a1.4 1.4 0 0 1-1.4-1.4v-9.9A1.4 1.4 0 0 1 2 8.7Zm8 2.9a2 2 0 0 0-1 3.7v3.4a1 1 0 0 0 2 0v-3.4a2 2 0 0 0-1-3.7Z"/>
            <path fill="none" stroke="currentColor" stroke-width="2.2"
                  d="M5.7 9.2V7.3a4.3 4.3 0 0 1 8.6 0v1.9"/>
          </svg>
          Ваши данные защищены и не будут переданы третьим лицам
        </p>
      </form>
    </section>
  </main>

  <script src="../js/phone-mask.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/validation.js" defer></script>
  <script src="../js/fit-height.js"></script>
</body>
</html>
