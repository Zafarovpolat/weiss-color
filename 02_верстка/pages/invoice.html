<!DOCTYPE html>
<!--
  Экран: М22 — Реквизиты юридического лица (окно для счёта)
  Исходник PSD: 01_исходники/макеты_psd/Реквизиты для счёта.psd
  Пункт ТЗ: п.8.2 — счёт выставляет менеджер по реквизитам компании;
  по макету окно только для юрлица (переключатель «Юрлицо / ИП» убран).
  Отдельная страница нужна, чтобы удобно верстать и показывать окно;
  в работе используется <dialog id="invoice-dialog"> на pages/checkout.html.
  Этап 1 (вёрстка): статическая адаптивная разметка HTML/CSS/JS на демо-данных.
-->
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- До подгонки по высоте страницу не показываем: браузер иначе рисует её
       в 1:1 и через мгновение «прыгает». Скрипт fit-height показывает
       страницу после загрузки шрифтов, уже с окончательным масштабом; если
       он не запустился — страхуют load и таймер на 4 с. Ниже 2550 подгонки нет. -->
  <style>@media (min-width:2550px){html{visibility:hidden}}</style>
  <script>(function(){window.__wcFit=0;function r(){if(!window.__wcFit)document.documentElement.style.visibility="visible"}addEventListener("load",function(){if(!window.__wcFitInit)r()});setTimeout(r,4000)})();</script>
  <noscript><style>@media (min-width:2550px){html{visibility:visible!important}}</style></noscript>
  <link rel="preload" as="script" href="../js/fit-height.js">
  <script src="../js/zoom-mode.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Реквизиты для счёта — Weiss Color</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">
  <link rel="preload" as="font" type="font/woff2" href="../assets/fonts/montserrat-cyrillic-500-normal.woff2" crossorigin>
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/checkout.css">
  <link rel="stylesheet" href="../css/invoice.css">
</head>
<body class="invoice-page">
  <a class="skip-link" href="#main">К основному содержанию</a>

  <main id="main" class="invoice-page__center">
    <section class="invoice-card" aria-labelledby="invoice-title">
      <div class="invoice-card__head">
        <h1 class="invoice-card__title" id="invoice-title">Реквизиты юридического лица</h1>
        <a class="invoice-card__close" href="checkout.html" aria-label="Закрыть окно">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M5 5l14 14M19 5 5 19" stroke-linecap="round"/>
          </svg>
        </a>
      </div>

      <p class="invoice-card__hint">Заполните данные компании для выставления счета</p>

      <form class="invoice-form" id="invoice-page-form" novalidate>
        <div class="invoice-form__grid">
          <label class="field field--full">
            <span class="field__label">Название организации <b aria-hidden="true">*</b></span>
            <input class="field__input" type="text" name="org" autocomplete="organization" placeholder="Например, ООО «СтройГрупп»" required>
          </label>

          <label class="field">
            <span class="field__label">ИНН <b aria-hidden="true">*</b></span>
            <input class="field__input" type="text" name="inn" inputmode="numeric" pattern="[0-9]{10}|[0-9]{12}" placeholder="Например, 7701234567" data-error="ИНН — 10 цифр у юрлица или 12 у ИП" required>
          </label>

          <label class="field" data-for="legal">
            <span class="field__label">КПП <b aria-hidden="true">*</b></span>
            <input class="field__input" type="text" name="kpp" inputmode="numeric" pattern="[0-9]{9}" placeholder="Например, 770101001" data-error="КПП — 9 цифр" required>
          </label>

          <label class="field">
            <span class="field__label" data-label-legal="ОГРН <b aria-hidden='true'>*</b>" data-label-ip="ОГРНИП <b aria-hidden='true'>*</b>">ОГРН <b aria-hidden="true">*</b></span>
            <input class="field__input" type="text" name="ogrn" inputmode="numeric" pattern="[0-9]{13}|[0-9]{15}" placeholder="Например, 1027700132195" data-error="ОГРН — 13 цифр, ОГРНИП — 15" required>
          </label>

          <label class="field">
            <span class="field__label">Юридический адрес <b aria-hidden="true">*</b></span>
            <input class="field__input" type="text" name="legal-address" autocomplete="street-address" placeholder="Например, 123456, г. Москва, ул. Лесная, д. 10" required>
          </label>

          <label class="field">
            <span class="field__label">E-mail для счета <b aria-hidden="true">*</b></span>
            <input class="field__input" type="email" name="invoice-email" inputmode="email" autocomplete="email" placeholder="example@company.ru" required>
          </label>

          <label class="field">
            <span class="field__label">Телефон <b aria-hidden="true">*</b></span>
            <input class="field__input" type="tel" name="invoice-phone" inputmode="tel" autocomplete="tel" placeholder="+7 (___) ___-__-__" required>
          </label>

          <label class="field field--full">
            <span class="field__label">Дополнительные реквизиты / комментарий</span>
            <textarea class="field__input" name="invoice-comment" rows="3" maxlength="300" placeholder="Укажите дополнительные реквизиты, банковские данные или комментарий для выставления счета"></textarea>
          </label>
        </div>

        <p class="invoice-form__note">
          <span class="invoice-form__info" aria-hidden="true">i</span>
          Указанные данные будут использованы для формирования и отправки счета на оплату.
          Мы не передаем их третьим лицам.
        </p>

        <div class="invoice-form__actions">
          <button class="invoice-form__btn invoice-form__btn--primary" type="submit">Сохранить</button>
          <a class="invoice-form__btn invoice-form__btn--ghost" href="checkout.html">Отменить</a>
        </div>
      </form>
    </section>
  </main>

  <script src="../js/phone-mask.js"></script>
  <script src="../js/invoice.js"></script>
  <script src="../js/validation.js" defer></script>
  <script src="../js/fit-height.js"></script>
</body>
</html>
