<head>

<title>Карточка товара: новая фоновая фотография</title>
<style>
  body{margin:0;padding:32px;font:15px/1.55 "Montserrat",Arial,sans-serif;color:#1f2937;background:#eef0f3}
  main{max-width:1300px;margin:0 auto}
  h1{font-size:24px;margin:0 0 8px}
  p{margin:0 0 24px;color:#4b5563}
  figure{margin:0 0 28px;background:#fff;border:1px solid #d7dbe1;border-radius:6px;overflow:hidden}
  figure img{display:block;width:100%;height:auto}
  figcaption{padding:10px 14px;font-size:13px;color:#6b7280}
  a{color:#7e5337}
</style>
</head>
<body>
<main>
  <h1>Карточка товара: новая фоновая фотография</h1>
  <p>Сверху вниз: прежний фон, новый фон и крупный план кресла. Композиция страницы, банка и её тень не менялись — заменена только фотография. Снимки при ширине окна 1920 и 2560.</p>

  <figure>
    <img src="fon-1920.jpg" alt="Старый и новый фон при ширине 1920">
    <figcaption>1920 — <a href="fon-1920.jpg">открыть картинку отдельно</a></figcaption>
  </figure>

  <figure>
    <img src="fon-2560.jpg" alt="Старый и новый фон при ширине 2560">
    <figcaption>2560 — <a href="fon-2560.jpg">открыть картинку отдельно</a></figcaption>
  </figure>
</main>
</body>
